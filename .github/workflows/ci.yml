name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run pack
      - name: Verify committed client bundle is current
        run: git diff --exit-code -- client.js
      - uses: actions/upload-artifact@v4
        if: matrix.node == 22
        with:
          name: conversation-tree-package
          path: |
            dist/*.tgz
            dist/SHA256SUMS
          if-no-files-found: error
